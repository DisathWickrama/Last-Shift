# Build the game and publish it to GitHub Pages.
#
# Runs on every push to the working branch and to main, so the live link always
# shows the latest pushed version. It can also be started by hand from the
# Actions tab ("Run workflow").
#
# One-time setup in the repository settings:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#   Settings -> Environments -> github-pages -> Deployment branches and tags:
#     add the working branch (or choose "No restriction")

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/dreamy-brahmagupta-xax7nf
  workflow_dispatch:

# The deploy step needs to write to Pages and prove who it is; nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# If two pushes arrive close together, let the newer one win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
